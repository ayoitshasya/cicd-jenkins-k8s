# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-app-deployment
  labels:
    app: cicd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-app
  template:
    metadata:
      labels:
        app: cicd-app
    spec:
      containers:
        - name: cicd-app
          image: ayoitshasya/cicd-app:latest
          ports:
            - containerPort: 5000
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-app-service
spec:
  type: NodePort
  selector:
    app: cicd-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080